name: Build OpenTerm IPA

on:
  workflow_dispatch:   # run manually from Actions tab
  # Optional: push: branches: [ main ]

jobs:
  build:
    runs-on: macos-26   # or macos-latest (usually macos-15 or 26 in 2026)

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4
      with:
        submodules: recursive   # important – pulls ios_system etc.

    - name: Run bootstrap.sh
      run: ./bootstrap.sh

    - name: Install Apple certificate & profile
      env:
        BUILD_CERTIFICATE_BASE64: ${{ secrets.BUILD_CERTIFICATE_BASE64 }}
        P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        BUILD_PROVISION_PROFILE_BASE64: ${{ secrets.BUILD_PROVISION_PROFILE_BASE64 }}
        KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
      run: |
        CERT_PATH=$RUNNER_TEMP/cert.p12
        PP_PATH=$RUNNER_TEMP/profile.mobileprovision
        KEYCHAIN_PATH=$RUNNER_TEMP/signing.keychain

        echo "$BUILD_CERTIFICATE_BASE64" | base64 --decode > $CERT_PATH
        echo "$BUILD_PROVISION_PROFILE_BASE64" | base64 --decode > $PP_PATH

        security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security default-keychain -s "$KEYCHAIN_PATH"
        security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
        security import $CERT_PATH -k "$KEYCHAIN_PATH" -P "$P12_PASSWORD" -T /usr/bin/codesign
        mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
        cp $PP_PATH ~/Library/MobileDevice/Provisioning\ Profiles/

    - name: Build & Archive
      run: |
        xcodebuild clean archive \
          -workspace OpenTerm.xcworkspace \
          -scheme OpenTerm \
          -sdk iphoneos \
          -archivePath ./build/OpenTerm.xcarchive \
          CODE_SIGN_STYLE=Manual \
          DEVELOPMENT_TEAM=4Z7V3V3G9R \
          PROVISIONING_PROFILE_SPECIFIER="OpenTerm Distribution Profile"   # ← add this

    - name: Export IPA
      run: |
        mkdir -p ./build/ipa
        xcodebuild -exportArchive \
          -archivePath ./build/OpenTerm.xcarchive \
          -exportPath ./build/ipa \
          -exportOptionsPlist <<EOF
        <?xml version="1.0" encoding="UTF-8"?>
        <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
        <plist version="1.0">
        <dict>
          <key>method</key>
          <string>development</string>  <!-- or ad-hoc -->
          <key>provisioningProfiles</key>
          <dict>
            <key>com.yourname.openterm</key>  <!-- ← your bundle ID -->
            <string>Your Provisioning Profile Name</string>  <!-- from Profiles page -->
          </dict>
        </dict>
        </plist>
        EOF

    - name: Upload IPA artifact
      uses: actions/upload-artifact@v4
      with:
        name: openterm-ipa
        path: ./build/ipa/*.ipa
